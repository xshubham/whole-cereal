apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: book-library-test
  namespace: argocd
spec:
  project: book-library
  source:
    repoURL: https://github.com/yourusername/whole-cereal.git
    targetRevision: HEAD
    path: k8s/apps/book-api/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: book-api-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m