global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  
  query_log_file: '/prometheus/promql_query_logs.log'
  scrape_failure_log_file: '/prometheus/scrape_failure_logs.log'

scrape_configs:
  - job_name: 'book_library_api_service'
    static_configs:
      - targets: ['opentelemetry-collector:8889']
    metrics_path: '/metrics'
